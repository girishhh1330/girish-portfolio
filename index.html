
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f19;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #111827;
        }

        h1 {
            color: #00e5ff;
            font-size: 32px;
        }

        .hero {
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #aaa;
            font-size: 17px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #00e5ff;
            color: black;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        section {
            padding: 40px 20px;
        }

        section h2 {
            color: #00e5ff;
            margin-bottom: 20px;
        }

        footer {
            padding: 20px;
            background: #111827;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY PORTFOLIO</h1>
    </header>

    <div class="hero">
        <h2>Hello, I'm Girish 👋</h2>
        <p>I'm a Beginner Web Developer.</p>
        <a href="#about" class="btn">Explore More</a>
    </div>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I'm Girish. I love coding and creating websites.</p>
    </section>

    <section>
        <h2>My Skills</h2>
        <p>HTML | CSS | JavaScript</p>
    </section>

    <section>
        <h2>My Projects</h2>
        <p>Personal Portfolio Website</p>
    </section>

    <footer>
        <p>© 2026 Girish | All Rights Reserved</p>
    </footer>

</body>
</html>
